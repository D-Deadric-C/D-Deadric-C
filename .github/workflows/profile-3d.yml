# .github/workflows/profile-3d.yml
# Generates the isometric 3D contribution calendar used in the README.
# Commit this to the D-Deadric-C/D-Deadric-C profile repo.

name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"      # daily
  workflow_dispatch:           # lets you trigger it manually the first time
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: regenerate 3D contribution calendar" || exit 0
          git push
