# Generates the contribution-grid snake animation.
#
# Goes in the profile repo at .github/workflows/snake.yml
#
# Output is committed to a branch named "output", which is what the README
# reads from. The greyscale palette matches the monochrome profile theme
# rather than GitHub's default green.

name: Generate snake

on:
  schedule:
    # Every 12 hours, so the animation tracks recent contributions.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Build snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#E6EDF3&color_dots=#161B22,#30363D,#484F58,#6E7681,#8B949E
            dist/snake-light.svg?color_snake=#24292F&color_dots=#EBEDF0,#D0D7DE,#AFB8C1,#8C959F,#6E7781

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
