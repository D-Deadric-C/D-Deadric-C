# Generates the contribution-grid snake animation.
#
# Replaces the existing .github/workflows/snake.yml in the profile repo.
#
# The only change from a stock setup is the palette: greyscale instead of
# GitHub's green, to match the monochrome README. Output filenames are kept
# exactly as before so the README references keep working.

name: Generate snake

on:
  schedule:
    # Twice a day, so the animation tracks recent contributions.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Build snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Filenames must match what the README already points at.
          # color_dots runs from the empty cell to the busiest, low to high.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#24292F&color_dots=#EBEDF0,#D0D7DE,#AFB8C1,#8C959F,#57606A
            dist/github-contribution-grid-snake-dark.svg?color_snake=#F0F6FC&color_dots=#161B22,#30363D,#484F58,#6E7681,#8B949E

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
