name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: D-Deadric-C
          # Monochrome contribution grid, single green accent snake — matches
          # the rest of the profile's mono + one-accent-color aesthetic.
          # color_dots runs empty cell -> busiest day.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3FB950&color_dots=#FFFFFF,#CCCCCC,#999999,#4D4D4D,#000000
            dist/github-contribution-grid-snake-dark.svg?color_snake=#3FB950&color_dots=#000000,#333333,#666666,#B3B3B3,#FFFFFF

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
