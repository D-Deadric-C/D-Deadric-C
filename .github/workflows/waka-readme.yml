# Renders WakaTime coding stats into assets/hours.svg.
#
# The old setup used athul/waka-readme to write a plain-text block between
# markers in the README. That block has been replaced by the hours dial, so this
# now runs scripts/hours_svg.py, which pulls last-7-days stats straight from the
# WakaTime API and redraws the SVG (dial arcs + per-language bars).
#
# Setup:
#   1. Install the WakaTime extension in your editor and sign in.
#   2. wakatime.com -> Settings -> copy your Secret API Key.
#   3. This repo -> Settings -> Secrets and variables -> Actions -> New secret
#      Name: WAKATIME_API_KEY
#
# If the key is missing or the API call fails the script leaves the existing
# SVG alone, so a bad run never blanks the section.

name: WakaTime Stats

on:
  schedule:
    # Daily at 00:30 UTC — WakaTime aggregates overnight.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Redraw hours.svg from WakaTime
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/hours_svg.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/hours.svg
          git commit -m "chore: update WakaTime hours" || exit 0
          git push
