<text x="22" y="170" font-family="ui-monospace,'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12.5" fill="#B8C0C8" opacity="0">WireGuard over UDP, falling back to a TLS-disguised<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.60s" fill="freeze"/></text>
